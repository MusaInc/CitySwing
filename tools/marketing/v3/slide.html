<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Outfit; font-weight: 600; src: url(../../../assets/fonts/outfit_semibold.ttf); }
@font-face { font-family: Outfit; font-weight: 700; src: url(../../../assets/fonts/outfit_bold.ttf); }
@font-face { font-family: Outfit; font-weight: 900; src: url(../../../assets/fonts/outfit_black.ttf); }
:root { --gold: #ffc83a; --ivory: #f7f1e6; --ink: 9, 8, 28; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 100vw; height: 100vh; overflow: hidden; background: #09081c; font-family: Outfit, sans-serif; color: var(--ivory); }
/* u = one unit of the short side, so both devices share proportions */
body { --u: 1vh; }
body.ipad { --u: 0.82vh; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: contrast(1.07) saturate(1.14); }
body.plate #game { filter: blur(calc(var(--u) * 1.6)) brightness(.5) saturate(1.2); transform: scale(1.06); }
.scrim { position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, rgba(var(--ink), .86) 0%, rgba(var(--ink), .62) 24%, rgba(var(--ink), .18) 44%, rgba(var(--ink), 0) 56%),
    linear-gradient(0deg, rgba(var(--ink), .55) 0%, rgba(var(--ink), 0) 26%),
    radial-gradient(ellipse at 66% 50%, rgba(0,0,0,0) 45%, rgba(var(--ink), .38) 100%); }
body.ipad .scrim { background:
    linear-gradient(180deg, rgba(var(--ink), .9) 0%, rgba(var(--ink), .78) 30%, rgba(var(--ink), .3) 46%, rgba(var(--ink), 0) 58%),
    linear-gradient(0deg, rgba(var(--ink), .55) 0%, rgba(var(--ink), 0) 22%),
    radial-gradient(ellipse at 60% 60%, rgba(0,0,0,0) 45%, rgba(var(--ink), .38) 100%); }
.copy { position: absolute; left: calc(var(--u) * 8); top: 50%; transform: translateY(-50%); width: 44vw; }
body.ipad .copy { top: calc(var(--u) * 8); transform: none; width: 80vw; }
.wordmark { height: calc(var(--u) * 5.4); display: block; margin-bottom: calc(var(--u) * 5); }
body.hero .wordmark { height: calc(var(--u) * 10.5); margin-bottom: calc(var(--u) * 4.5); }
.kicker { display: flex; align-items: center; gap: calc(var(--u) * 1.6); font-weight: 700; font-size: calc(var(--u) * 3.1); letter-spacing: .2em; color: var(--gold); text-transform: uppercase; margin-bottom: calc(var(--u) * 2.2); }
.kicker::before { content: ""; width: calc(var(--u) * 6); height: calc(var(--u) * .7); background: var(--gold); border-radius: 99px; }
h1 { font-weight: 900; font-size: calc(var(--u) * 14.5); line-height: .88; text-transform: uppercase; letter-spacing: -.01em;
  transform: skewX(-9deg); transform-origin: left bottom; text-shadow: 0 calc(var(--u) * .5) calc(var(--u) * 3) rgba(0,0,0,.45); white-space: nowrap; }
h1 .b { color: var(--gold); display: block; }
.swoosh { display: block; width: calc(var(--u) * 52); height: calc(var(--u) * 6); margin: calc(var(--u) * .6) 0 calc(var(--u) * 2.6) calc(var(--u) * -1); overflow: visible; }
.sub { font-weight: 600; font-size: calc(var(--u) * 4.1); line-height: 1.28; color: rgba(247,241,230,.92); max-width: calc(var(--u) * 92); text-shadow: 0 2px 12px rgba(0,0,0,.5); }
.chips { display: flex; gap: calc(var(--u) * 1.4); margin-top: calc(var(--u) * 4); flex-wrap: wrap; }
.chip { font-weight: 700; font-size: calc(var(--u) * 2.6); letter-spacing: .12em; text-transform: uppercase; padding: calc(var(--u) * 1.3) calc(var(--u) * 2.4);
  border-radius: 99px; border: calc(var(--u) * .25) solid rgba(255,200,58,.75); color: var(--ivory); background: rgba(var(--ink), .45); backdrop-filter: blur(8px); }
.chip.solid { background: var(--gold); color: #120f24; border-color: var(--gold); }
.lineup { position: absolute; inset: 0; pointer-events: none; }
.lineup img { position: absolute; -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%); filter: drop-shadow(0 calc(var(--u) * 2) calc(var(--u) * 3) rgba(0,0,0,.55)); }
</style></head>
<body>
<img id="game" alt="">
<div class="lineup" id="lineup"></div>
<div class="scrim"></div>
<div class="copy">
  <img class="wordmark" src="../../../assets/brand/wordmark.png" alt="">
  <div class="kicker" id="kicker"></div>
  <h1><span id="h1a"></span><span class="b" id="h1b"></span></h1>
  <svg class="swoosh" viewBox="0 0 520 60" preserveAspectRatio="none"><path d="M4 44 C 140 58, 330 52, 500 12" fill="none" stroke="#ffc83a" stroke-width="7" stroke-linecap="round"/><circle cx="504" cy="10" r="9" fill="#f7f1e6"/></svg>
  <p class="sub" id="sub"></p>
  <div class="chips" id="chips"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const s = JSON.parse(q.get('slide'));
document.body.classList.add(q.get('device') === 'ipad13' ? 'ipad' : 'iphone');
if (s.hero) document.body.classList.add('hero');
if (s.lineup) document.body.classList.add('plate');
document.getElementById('game').src = q.get('source');
document.getElementById('kicker').textContent = s.kicker;
document.getElementById('h1a').textContent = s.h1[0];
document.getElementById('h1b').textContent = s.h1[1];
document.getElementById('sub').textContent = s.sub;
for (const [i, c] of (s.chips || []).entries()) {
  const el = document.createElement('span'); el.className = 'chip' + (i === 0 && s.hero ? ' solid' : ''); el.textContent = c;
  document.getElementById('chips').append(el);
}
if (s.lineup) {
  // Real wardrobe renders (tools/marketing/lineup_render.gd), webs leaving the top edge.
  const ipad = q.get('device') === 'ipad13';
  // [centre x vw, top vh, height vh]; the top of each image fades so web ends never show.
  const spots = ipad
    ? [[66, 30, 44], [86, 26, 44], [30, 60, 38], [50, 56, 42], [72, 60, 40]]
    : [[58, 8, 60], [67, -2, 70], [76, 10, 60], [85, 0, 68], [93, 12, 56]];
  s.lineup.forEach((src, i) => {
    const [x, y, h] = spots[i]; const im = document.createElement('img'); im.src = src;
    im.style.left = x + 'vw'; im.style.top = y + 'vh'; im.style.height = h + 'vh'; im.style.transform = 'translateX(-50%)';
    document.getElementById('lineup').append(im);
  });
}
</script>
</body></html>
