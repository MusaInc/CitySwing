<!doctype html>
<!-- CitySwing app icon (direction "Hero in the Arc"). Every raster here is a
     real game render: art/sky_canyon.png is the downtown towers at sunset from
     street level (tools/store_shots.sh --cam), art/hero_swing.png is the
     in-game hero mid-swing on a real web (tools/brand/hero_render.gd).
     The gold arc is the swing's own pendulum path round the web's anchor. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#110D26}
.l{position:absolute;inset:0}
#sky{background:url(art/sky_canyon.png) center/112% no-repeat;filter:brightness(.42) saturate(.8) contrast(1.1) blur(3px)}
#glow{background:radial-gradient(circle at 53% 44%,rgba(255,226,150,1) 0,rgba(255,201,60,.95) 15%,rgba(255,140,50,.62) 27%,rgba(190,70,60,.25) 40%,rgba(17,13,38,0) 56%)}
#vig{background:radial-gradient(circle at 50% 45%,rgba(17,13,38,0) 38%,rgba(17,13,38,.78) 82%,#110D26 100%)}
#hero{position:absolute;width:1010px;height:1010px;left:-46px;top:-10px;background:url(art/hero_swing.png) center/contain no-repeat;
  filter:brightness(.8) contrast(1.15) drop-shadow(0 0 3px rgba(17,13,38,.9)) drop-shadow(0 18px 28px rgba(0,0,0,.55))}
svg{position:absolute;inset:0}
</style></head><body>
<div class="l" id="sky"></div>
<div class="l" id="glow"></div>
<div class="l" id="vig"></div>
<svg viewBox="0 0 1024 1024">
  <!-- The swing arc: centred on the web's anchor (above the frame, on the
       line's extension), through the hero's hips. -->
  <path id="arc" d="" fill="none" stroke="#FFC93C" stroke-width="42" stroke-linecap="round"/>
</svg>
<div id="hero"></div>
<script>
// Anchor on the web line's extension above the frame; the arc passes the hips.
const ax = 1110, ay = -520, hx = 500, hy = 640;
const r = Math.hypot(hx - ax, hy - ay);
const a0 = Math.atan2(hy - ay, hx - ax) + 0.62, a1 = Math.atan2(hy - ay, hx - ax) - 0.34;
const p = a => [ax + r * Math.cos(a), ay + r * Math.sin(a)];
const [x0, y0] = p(a0), [x1, y1] = p(a1);
document.getElementById("arc").setAttribute("d", `M${x0} ${y0} A${r} ${r} 0 0 0 ${x1} ${y1}`);
</script>
</body></html>
