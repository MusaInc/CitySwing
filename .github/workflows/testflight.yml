# Builds City Swing for iPhone on a GitHub-hosted Mac and uploads it to
# TestFlight. Run it from the Actions tab (Run workflow) – it never runs on
# its own. See docs/IOS_BUILD.md ("TestFlight without a Mac").
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID         10-character Apple Developer team ID
#   ASC_KEY_ID            App Store Connect API key ID (role: App Manager or Admin)
#   ASC_ISSUER_ID         its issuer ID
#   ASC_KEY_P8            the .p8 private key file contents
# The app record (bundle ID com.musastudios.cityswing) must exist in App
# Store Connect first: My Apps → + → New App.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version (CFBundleShortVersionString)"
        default: "0.1.0"

env:
  GODOT_VERSION: "4.5.1"

defaults:
  run:
    shell: bash -eo pipefail {0}  # a failing xcodebuild must fail the step, even piped into tail

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (App Store Connect rejects builds from older SDKs)
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          dest="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dest/"
          echo "GODOT=$PWD/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Export the Xcode project
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          sed -i '' "s/^application\/app_store_team_id=.*/application\/app_store_team_id=\"$TEAM\"/" export_presets.cfg
          sed -i '' "s/^application\/short_version=.*/application\/short_version=\"$VERSION\"/" export_presets.cfg
          sed -i '' "s/^application\/version=.*/application\/version=\"$BUILD\"/" export_presets.cfg
          mkdir -p build/ios
          "$GODOT" --headless --import >/dev/null 2>&1 || true
          "$GODOT" --headless --export-release "iOS" build/ios/CitySwing.ipa
          test -d build/ios/CitySwing.xcodeproj

      - name: App Store Connect API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$P8" > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Check the App Store Connect app record
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request, jwt
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{os.environ['KEY_ID']}.p8")).read()
          now = int(time.time())
          token = jwt.encode({"iss": os.environ["ISSUER"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                             key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.musastudios.cityswing",
                                       headers={"Authorization": f"Bearer {token}"})
          try:
              apps = json.load(urllib.request.urlopen(req))["data"]
          except urllib.error.HTTPError as e:
              sys.exit(f"App Store Connect API refused the key: HTTP {e.code} {e.read().decode()[:300]}")
          if not apps:
              sys.exit("No App Store Connect app for com.musastudios.cityswing – create it: My Apps → + → New App.")
          print("App record:", apps[0]["id"], apps[0]["attributes"]["name"])
          PY

      - name: Archive (unsigned; the export step signs in the cloud)
        # Signing here made CI create a new "Apple Development" certificate on
        # every fresh runner until the account hit Apple's certificate limit.
        # The archive is built unsigned; -exportArchive signs it with the
        # cloud-managed distribution certificate (needs an Admin API key).
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project build/ios/CitySwing.xcodeproj -scheme CitySwing \
            -configuration Release -destination "generic/platform=iOS" \
            -archivePath build/CitySwing.xcarchive archive \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" | tail -40

      - name: Upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/CitySwing.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/upload \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -40
          echo "Uploaded build ${{ github.run_number }} – it appears in App Store Connect → TestFlight after processing (5–30 min)."

      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/private_keys"
